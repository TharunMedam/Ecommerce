<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-Commerce Web Application</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #18202f; }
    main { max-width: 980px; margin: 0 auto; padding: 32px; }
    header, section { background: #fff; border: 1px solid #d9e0eb; border-radius: 8px; padding: 22px; margin-bottom: 18px; }
    h1, h2 { margin-top: 0; }
    button, input { font: inherit; padding: 10px 12px; border-radius: 6px; border: 1px solid #bac5d6; }
    button { background: #2563eb; color: #fff; border-color: #2563eb; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .card { border: 1px solid #d9e0eb; border-radius: 8px; padding: 16px; }
    pre { white-space: pre-wrap; background: #101827; color: #dce7ff; padding: 16px; border-radius: 8px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>E-Commerce Web Application</h1>
      <p>Catalog, session, cart, checkout, inventory, and admin order workflow built as a runnable portfolio implementation.</p>
      <button id="start">Create Demo Session</button>
    </header>
    <section>
      <h2>Products</h2>
      <div id="products" class="grid"></div>
    </section>
    <section>
      <h2>Cart and Orders</h2>
      <pre id="output">Create a session to start.</pre>
      <button id="checkout">Checkout</button>
    </section>
  </main>
  <script>
    let sessionId = "";
    const output = document.querySelector("#output");

    async function api(path, options = {}) {
      const result = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options
      });
      return result.json();
    }

    async function loadProducts() {
      const data = await api("/api/products");
      document.querySelector("#products").innerHTML = data.products.map(product => `
        <div class="card">
          <h3>${product.name}</h3>
          <p>${product.category} | $${product.price} | ${product.inventory} in stock</p>
          <button data-product="${product.id}">Add to cart</button>
        </div>
      `).join("");
    }

    document.querySelector("#start").addEventListener("click", async () => {
      const session = await api("/api/sessions", {
        method: "POST",
        body: JSON.stringify({ name: "Demo User", email: "demo@example.com" })
      });
      sessionId = session.sessionId;
      output.textContent = JSON.stringify(session, null, 2);
    });

    document.querySelector("#products").addEventListener("click", async event => {
      const productId = event.target.dataset.product;
      if (!productId || !sessionId) return;
      const cart = await api("/api/cart/items", {
        method: "POST",
        body: JSON.stringify({ sessionId, productId, quantity: 1 })
      });
      output.textContent = JSON.stringify(cart, null, 2);
    });

    document.querySelector("#checkout").addEventListener("click", async () => {
      if (!sessionId) return;
      const order = await api("/api/checkout", {
        method: "POST",
        body: JSON.stringify({ sessionId, address: "Cincinnati, OH" })
      });
      output.textContent = JSON.stringify(order, null, 2);
    });

    loadProducts();
  </script>
</body>
</html>
